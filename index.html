<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0c0c0c">
    <title>Modex — Model index</title>
    <meta name="description" content="Labs, models, and the providers that serve them, on a dark Earth.">
  </head>
  <body>
    <div id="app">
      <div id="globe" aria-label="Globe of model labs"></div>
      <header class="mast"><b>MODEX</b><span>labs · models · providers</span></header>
      <div class="hud">
        <input id="search" type="search" placeholder="Find a lab" aria-label="Find a lab">
        <button id="recent" type="button" aria-pressed="false">Last 15 days</button>
        <p class="legend" aria-hidden="true"><i class="mark lab"></i>Lab <i class="mark model"></i>Model <i class="mark host"></i>Provider</p>
        <span id="status">Loading catalog…</span>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <section class="card" id="card" hidden>
        <button id="card-close" type="button" aria-label="Close">×</button>
        <p class="eyebrow" id="card-id">LAB</p>
        <h1 id="card-name">—</h1>
        <p class="sub" id="card-sub"></p>
        <dl class="facts" id="card-body"></dl>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
