<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Modex — Model index</title>
    <meta name="description" content="Labs, models, and the providers that serve them, on a dark Earth.">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app" data-state="loading">
      <div class="boot" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span>MODEX</span><small id="boot-msg">Loading catalog…</small></div>
      <div id="globe" aria-label="Globe of model labs"></div>

      <header class="topbar">
        <p class="brand"><i class="dot" aria-hidden="true"></i>MODEX</p>
        <div class="topbar-right">
          <span id="clock" class="clock"></span>
          <button id="refresh" class="icon-btn" type="button" aria-label="Refresh catalog" title="Refresh catalog">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="card" id="card" hidden>
        <button id="card-close" class="close" type="button" aria-label="Close">×</button>
        <p class="eyebrow" id="card-id">LAB</p>
        <h1 id="card-name">—</h1>
        <p class="accent-line" id="card-when"></p>
        <p class="prompt" id="card-sub"></p>
        <dl class="facts" id="card-body"></dl>
      </section>

      <details class="panel filters" open>
        <summary>Filters</summary>
        <input id="search" type="search" placeholder="Find a lab" aria-label="Find a lab" autocomplete="off">
        <div class="seg" role="group" aria-label="Release window">
          <button id="win-all" type="button" class="on" aria-pressed="true"><span>All</span><b id="count-all">0</b></button>
          <button id="recent" type="button" aria-pressed="false"><span>15 days</span><b id="count-recent">0</b></button>
        </div>
        <p class="group-label">Show</p>
        <div class="legend" role="group" aria-label="Categories">
          <button type="button" data-cat="lab" class="on" aria-pressed="true">
            <svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 10.5 3.4v5.2L6 11.2 1.5 8.6V3.4Z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="4.3" r="1.1" fill="currentColor"/><circle cx="4.2" cy="7.4" r="1.1" fill="currentColor"/><circle cx="7.8" cy="7.4" r="1.1" fill="currentColor"/></svg>
            <span>Lab</span><b id="count-labs">0</b>
          </button>
          <button type="button" data-cat="model" class="on" aria-pressed="true">
            <svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 10.8 6 6 10.8 1.2 6Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <span>Model</span><b id="count-models">0</b>
          </button>
          <button type="button" data-cat="host" class="host" aria-pressed="false" title="Show every provider, not just the ones tied to your selection">
            <svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/></svg>
            <span>All providers</span><b id="count-hosts">0</b>
          </button>
          <button type="button" data-cat="pulse" class="on pulse" aria-pressed="true">
            <svg class="mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <span>Pulse ≤ 15d</span><b id="count-pulse">0</b>
          </button>
        </div>
        <p class="meta" id="status">Loading catalog…</p>
      </details>

      <details class="panel latest" open>
        <summary>Latest <small id="latest-window">7 days</small><b id="latest-count">0</b></summary>
        <ol id="latest"></ol>
      </details>

      <p class="hint">Drag to rotate · Scroll to zoom · Select a lab</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
